[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "motivo-isaac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "easydict>=1.13",
    "exca==0.4.5",  # 0.5.x changed @infra.apply semantics -> "Infra not applied to a method"
    "hf-xet>=1.1.2",
    "huggingface-hub>=0.30.2",
    "humenv",
    "hydra-core>=1.2.0",
    "isaaclab[all,isaacsim]==2.3.0; sys_platform == 'linux'",
    "isaacsim[all,extscache]==5.1.0; sys_platform == 'linux'",
    "joblib>=1.4.2",
    "loguru>=0.7.3",
    "lxml>=5.3.2",
    "mediapy>=1.2.3",
    "ml-collections>=1.1.0",
    "mujoco==3.5.0",
    "notebook>=7.4.2",
    "numpy==1.26.0",
    "numpy-stl>=3.2.0",
    "onnx>=1.16.1",
    "onnxruntime>=1.22.0",
    "open3d>=0.19.0",
    "pot>=0.9.5",
    "pydantic>=2.11.3",
    "rich>=14.0.0",
    "safetensors>=0.5.3",
    "tensordict>=0.8.3",
    "termcolor>=3.0.1",
    "torch==2.7.0+cu128; sys_platform == 'linux'",
    "torchaudio==2.7.0+cu128; sys_platform == 'linux'",
    "torchvision==0.22.0+cu128; sys_platform == 'linux'",
    "tyro",  # unpinned: isaacsim 5.1 caps tyro <0.9.18; repo only uses tyro.cli()
    "wandb",
    "xxhash>=3.5.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

# RTX 5090 (Blackwell / sm_120) needs the CUDA 12.8 PyTorch wheels.
# explicit=true keeps this index out of the candidate set for every package
# except the torch trio pinned in [tool.uv.sources] below.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# [project.optional-dependencies]
# sim2real = [
#     "unitree-sdk2py",
#     "loop-rate-limiters>=1.1.0",
#     "sshkeyboard>=2.3.1",
#     "pygame>=2.0.0",
# ]

[tool.uv.sources]
# unitree-sdk2py = { path = "unitree_sdk2_python", editable = true }
humenv = { git = "https://github.com/facebookresearch/humenv.git" }
# Pin the torch trio to the cu128 index only (never the tuna/nvidia mirrors),
# so the +cu128 Blackwell wheels resolve unambiguously under unsafe-best-match.
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

# isaaclab 2.3.0 pulls flatdict==4.0.1 (setup.cfg-only, no pyproject). Its
# legacy build imports pkg_resources, which modern setuptools (>=81) no longer
# exposes -> build fails. Force an older setuptools that still ships it.
[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<81"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
humanoidverse = ["config/**/*", "data/**/*"]

[tool.setuptools.packages.find]
include = ["humanoidverse*"]

[tool.uv]
dev-dependencies = [
    "ruff==0.9.6",
]
index-strategy = "unsafe-best-match"
# isaacsim-core 5.1.0.0 declares a pywin32 dep with NO platform marker, so uv
# tries to install the Windows-only pywin32 on Linux and fails. Re-gate it.
override-dependencies = ["pywin32; sys_platform == 'win32'"]

[tool.ruff]
line-length = 140
extend-exclude = ["wandb"]

[tool.ruff.lint]
# E402: imports at the top of the files (but lazy import is useful to reduce memory use)
# E731: Do not assign lambdas (but these are handy for functional programming, and used in tests to change logic)
ignore = ["E402", "E731"]
# Add import sorting to the linting
extend-select = ["I"] # This is disabled as currently it causes different results on github and locally
